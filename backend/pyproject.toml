[project]
name = "geo-weekly-tracker-backend"
version = "0.1.0"
description = "GEO Weekly Tracker backend — Flask + SQLAlchemy(sync) + PostgreSQL + Gunicorn"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "gunicorn>=22.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic 자동 생성 마이그레이션은 손으로 줄바꿈하지 않는다 (autogenerate 재실행 시 다시 깨짐).
# I001/UP007/UP035는 alembic 자체 리비전 템플릿(Union/Sequence, import 순서)이 매번 만들어내는
# 보일러플레이트라 우리 코드 스타일 문제가 아니다 — 매 리비전마다 손으로 고치지 않는다.
"alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
